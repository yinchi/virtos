[package]
name = "scratch"
version = "0.1.0"
edition = "2024"

# Not a real program: a throwaway EL0 test harness, rewritten freely to exercise whatever
# kernel-side feature is being tested next, so `user/hello`/`user/echo` and their future siblings
# (`ls`, `cat`, ...) never have to be bent out of shape to do the same job -- see this crate's own
# `src/main.rs` doc comment. Built against `userlib` like every other program from here on. A
# sibling crate to the kernel, never a Cargo workspace member of it (see the kernel's own
# `Cargo.toml`/`tools/mkimage`'s "Repo organization" note in `plans/PORTING.md`): it wants the same
# bare-metal target as the kernel, inherited from the repo root's `.cargo/config.toml`, but its own
# `link.ld` (in this directory) gives it a completely different load address and layout.

[dependencies]
userlib = { path = "../userlib" }

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"

[[bin]]
name = "scratch"
path = "src/main.rs"
