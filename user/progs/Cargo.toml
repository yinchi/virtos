[package]
name = "progs"
version = "0.1.0"
edition = "2024"

# Every ordinary EL0 utility program, one `[[bin]]` per `src/bin/*.rs` file (Cargo's own default
# for that layout -- no explicit `[[bin]]` entries needed). Consolidated into one crate rather than
# one crate per program (the pattern `hello`/`echo`/`scratch` started with, migrated here) because
# every program shares the exact same `link.ld`/`build.rs`/target regardless -- they're never
# resident at the same time, so there was never a reason for each to carry its own copy of files
# that would always be identical anyway. `src/lib.rs` holds helpers shared across programs (`cli`:
# flag parsing on `getargs`, the same crate the reference lab uses for the same job) once more than
# one program actually needs the same one. A sibling crate to the kernel, never a Cargo workspace
# member of it (see the kernel's own `Cargo.toml`/`tools/mkimage`'s "Repo organization" note in
# `plans/PORTING.md`): it wants the same bare-metal target as the kernel, inherited from the repo
# root's `.cargo/config.toml`, but its own `link.ld` gives it a completely different load address
# and layout.

[dependencies]
userlib = { path = "../userlib" }
textlib = { path = "../textlib" }
getargs = { version = "0.5", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
