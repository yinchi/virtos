# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"

# `just fmt-fix`/`clippy-fix` cover every crate in the repo, not just the kernel (root) one --
# `tools/mkimage` today, any future `user/*` crate automatically (see the justfile's `OTHER_CRATES`
# comment for how, and plans/PORTING.md's "Repo organization" for why they're separate crates in
# the first place, unreachable from a plain `cargo fmt`/`clippy --all` at the root).
[[repos.hooks]]
id = "cargo_fmt"
name = "Cargo fmt"
language = "system"
entry = "just fmt-fix"
pass_filenames = false

[[repos.hooks]]
id = "cargo_clippy"
name = "Cargo clippy"
language = "system"
entry = "just clippy-fix"
pass_filenames = false
