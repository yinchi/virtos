[package]
name = "virtos"
version = "0.1.0"
edition = "2024"

[dependencies]
hadris-fat = { version = "2.4.0", default-features = false, features = ["alloc", "lfn", "read", "write", "sync"] }
peg = { version = "0.8.6", default-features = false }
spin = "0.12.3"
unifont = "1.1.0"

# Everything below only builds for the real bare-metal target: it either touches hardware
# directly or (chrono/chrono-tz, linked_list_allocator) exists only to serve code that does.
# `cargo test --target <host triple>` builds against a target where `target_os` is not "none", so
# none of this -- or the kernel modules gated the same way in src/main.rs -- is even compiled,
# letting the pure logic modules (console/, keyboard/) run as ordinary host unit tests instead of
# needing QEMU. See `just test-host`.
[target.'cfg(target_os = "none")'.dependencies]
aarch64-paging = "0.12.1"
arm-gic = "0.10.0"
arm-pl011-uart = { version = "0.5.1", features = ["embedded-io"] }
arm-sysregs = { version = "0.5.1", features = ["el1"] }
arm_pl031 = "0.2.1"
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }
chrono-tz = { version = "0.10.4", default-features = false }
embedded-io = { version = "0.7.1", default-features = false, features = ["alloc"] }
fdt = "0.1.5"
linked_list_allocator = "0.10.6"
virtio-drivers = "0.13.0"

[build-dependencies]
cc = "1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
